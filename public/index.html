<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Presentation Timer</title>
<meta name="description" content="Presentation + Q&amp;A countdown timer with a last-minute warning."/>
<meta name="theme-color" content="#0a0816"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%238b5cf6' stroke-width='5'/%3E%3Cpath d='M16 4a12 12 0 0 1 12 12' fill='none' stroke='%2334d399' stroke-width='5'/%3E%3C/svg%3E"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --pres:#8b5cf6; --pres2:#22d3ee;
    --warn:#fbbf24;
    --qa:#34d399;
    --done:#f87171;
    --muted:#a1a1aa;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% 0%,#1a1433 0%,#0a0816 65%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
  .card{background:linear-gradient(180deg,#1f1a2e 0%,#15121f 100%);
    border:1px solid rgba(255,255,255,.07);border-radius:26px;padding:28px 32px 24px;
    max-width:420px;width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .title{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    padding:5px 12px;border-radius:999px;font-size:11px;color:var(--muted);
    font-weight:500;font-variant-numeric:tabular-nums}

  /* settings */
  .settings{display:flex;gap:12px;margin-bottom:22px}
  .field{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);font-weight:500}
  .field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;font-weight:600;color:#fff;
    font-variant-numeric:tabular-nums}
  .field input:focus{outline:2px solid var(--pres);outline-offset:1px}
  .field input:disabled{opacity:.45;cursor:not-allowed}

  /* ring */
  .ring-wrap{display:flex;justify-content:center;margin-bottom:18px}
  .ring{position:relative;width:min(240px,100%);aspect-ratio:1}
  .ring svg{transform:rotate(-90deg);display:block;width:100%;height:100%}
  .track{fill:none;stroke-width:12;opacity:.14}
  .seg{fill:none;stroke-width:12;stroke-linecap:butt}
  #segPres{stroke:url(#presGrad)}
  #segWarn{stroke:var(--warn)}
  #segQa{stroke:var(--qa)}
  .t-pres{stroke:var(--pres)} .t-warn{stroke:var(--warn)} .t-qa{stroke:var(--qa)}
  .marker{stroke:#fff;stroke-width:2;opacity:.55}
  .card.phase-warn #segWarn{animation:pulse 1s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(251,191,36,.7))}
  .card.phase-pres #segPres{filter:drop-shadow(0 0 10px rgba(139,92,246,.35))}
  .card.phase-qa #segQa{filter:drop-shadow(0 0 10px rgba(52,211,153,.5))}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.card.phase-warn #segWarn{animation:none}}

  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;pointer-events:none}
  .phase{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .time{font-size:58px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.2em}
  .card.phase-pres .phase{color:#a78bfa}
  .card.phase-warn .phase,.card.phase-warn .time{color:var(--warn)}
  .card.phase-qa .phase,.card.phase-qa .time{color:var(--qa)}
  .card.phase-done .phase,.card.phase-done .time{color:var(--done)}

  /* buttons */
  .btns{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
  .btn{flex:1;max-width:110px;padding:12px 0;border-radius:12px;border:none;font-size:14px;font-weight:600;
    cursor:pointer;color:#fff;font-family:inherit;transition:transform .12s,filter .12s}
  .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .btn:active{transform:scale(.96)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .btn-start{background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .btn-pause{background:linear-gradient(135deg,#fb923c,#f97316);box-shadow:0 6px 16px rgba(249,115,22,.3)}
  .btn-reset{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 6px 16px rgba(239,68,68,.3)}

  /* legend */
  .legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:#71717a}
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%}
  .hint{text-align:center;font-size:10px;color:#52525b;margin-top:12px}
  @media (max-width:400px){
    body{padding:16px}
    .card{padding:22px 18px 20px}
    .time{font-size:50px}
  }
</style>
</head>
<body>
<div class="card phase-idle" id="card">
  <div class="header">
    <div class="title">Presentation Timer</div>
    <div class="pill" id="pill">7 + 5 min</div>
  </div>

  <div class="settings">
    <label class="field">Presentation (min)
      <input type="number" id="inPres" value="7" min="1" max="120" step="1" inputmode="numeric">
    </label>
    <label class="field">Q&amp;A (min)
      <input type="number" id="inQa" value="5" min="0" max="120" step="1" inputmode="numeric">
    </label>
  </div>

  <div class="ring-wrap">
    <div class="ring">
      <svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="presGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <!-- faint full-length tracks show the whole plan from the start -->
        <circle class="track t-pres" id="trPres" cx="120" cy="120" r="102"/>
        <circle class="track t-warn" id="trWarn" cx="120" cy="120" r="102"/>
        <circle class="track t-qa"   id="trQa"   cx="120" cy="120" r="102"/>
        <!-- live arcs: shrink clockwise as time passes -->
        <circle class="seg" id="segPres" cx="120" cy="120" r="102"/>
        <circle class="seg" id="segWarn" cx="120" cy="120" r="102"/>
        <circle class="seg" id="segQa"   cx="120" cy="120" r="102"/>
      </svg>
      <div class="ring-center">
        <div class="phase" id="phase">Ready</div>
        <div class="time" id="time" role="timer" aria-live="off">07:00</div>
        <div class="sub" id="sub">Total 12:00</div>
      </div>
    </div>
  </div>

  <div class="btns">
    <button class="btn btn-start" id="btnStart">Start</button>
    <button class="btn btn-pause" id="btnPause">Pause</button>
    <button class="btn btn-reset" id="btnReset">Reset</button>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--pres)"></i>Presentation</span>
    <span><i class="dot" style="background:var(--warn)"></i>Last minute</span>
    <span><i class="dot" style="background:var(--qa)"></i>Q&amp;A</span>
  </div>
  <div class="hint">Space = start / pause</div>
</div>

<script>
(function () {
  var WARN_SECONDS = 60;               // amber "wrap up" zone length
  var R = 102, C = 2 * Math.PI * R;    // ring radius / circumference

  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), inPres = $('inPres'), inQa = $('inQa');

  // ---- state -------------------------------------------------------------
  var P = 0, Q = 0, W = 0, T = 0;      // seconds: presentation, Q&A, warn zone, total
  var elapsed = 0;                      // seconds already counted
  var running = false, startedAt = 0, baseElapsed = 0, timer = null;
  var fired = { warn: false, pres: false, done: false };
  var audioCtx = null;

  // ---- helpers -----------------------------------------------------------
  // write=false while the user is still typing, so the field isn't rewritten mid-edit
  function clampMin(el, lo, hi, write) {
    var v = parseInt(el.value, 10);
    if (isNaN(v)) v = parseInt(el.defaultValue, 10);
    v = Math.min(hi, Math.max(lo, v));
    if (write !== false) el.value = v;
    return v;
  }
  function fmt(s) {
    s = Math.max(0, Math.ceil(s));
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function readSettings(write) {
    P = clampMin(inPres, 1, 120, write) * 60;
    Q = clampMin(inQa, 0, 120, write) * 60;
    W = Math.min(WARN_SECONDS, P);
    T = P + Q;
  }
  // draw an arc covering fractions [a,b] of the full circle (clockwise from top)
  function arc(el, a, b) {
    var len = Math.max(0, b - a) * C;
    el.setAttribute('stroke-dasharray', len + ' ' + (C + 1));
    el.setAttribute('stroke-dashoffset', -a * C);
  }

  // ---- ring --------------------------------------------------------------
  // Plan: [0 .. P-W] presentation | [P-W .. P] last minute | [P .. T] Q&A
  function drawRing() {
    var f = T ? elapsed / T : 0;
    var s1 = (P - W) / T, s2 = P / T;   // segment boundaries (fractions)
    arc($('trPres'), 0, s1);  arc($('trWarn'), s1, s2);  arc($('trQa'), s2, 1);
    arc($('segPres'), Math.max(0, f), s1 > f ? s1 : 0);
    arc($('segWarn'), Math.max(s1, f), s2 > f ? s2 : s1);
    arc($('segQa'),   Math.max(s2, f), 1);
    // a segment already passed must have zero length
    if (f >= s1) arc($('segPres'), 0, 0);
    if (f >= s2) arc($('segWarn'), 0, 0);
    if (f >= 1)  arc($('segQa'), 0, 0);
  }

  function phaseOf(e) {
    if (e >= T) return 'done';
    if (e >= P) return 'qa';
    if (e >= P - W) return 'warn';
    return 'pres';
  }

  function render() {
    var ph = running || elapsed > 0 ? phaseOf(elapsed) : 'idle';
    card.className = 'card phase-' + ph;

    var main, label, sub = 'Total ' + fmt(T - elapsed) + ' left';
    if (ph === 'idle')      { label = 'Ready';        main = P; sub = 'Total ' + fmt(T); }
    else if (ph === 'pres') { label = 'Presentation'; main = P - elapsed; }
    else if (ph === 'warn') { label = 'Wrap up';      main = P - elapsed; sub = 'Q&A starts at 00:00'; }
    else if (ph === 'qa')   { label = 'Q&A';          main = T - elapsed; }
    else                    { label = "Time's up";    main = 0; sub = 'Thank you!'; }

    $('phase').textContent = label;
    $('time').textContent = fmt(main);
    $('sub').textContent = sub;
    $('pill').textContent = (P / 60) + ' + ' + (Q / 60) + ' min';
    drawRing();
  }

  // ---- sound -------------------------------------------------------------
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function tones(list) {
    if (!audioCtx) return;
    list.forEach(function (t) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      var at = audioCtx.currentTime + t[2];
      o.type = 'sine'; o.frequency.value = t[0];
      g.gain.setValueAtTime(0.25, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + t[1]);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(at); o.stop(at + t[1]);
    });
  }
  var SOUND_WARN = [[660, 0.4, 0]];                              // 1 soft tone: 1 min left
  var SOUND_PRES = [[880, 0.4, 0], [880, 0.4, 0.5]];             // 2 tones: Q&A begins
  var SOUND_DONE = [[880, 0.5, 0], [660, 0.5, 0.28], [880, 0.6, 0.58]]; // end

  // ---- clock -------------------------------------------------------------
  function tick() {
    // timestamp-based: stays accurate even if the tab is throttled
    elapsed = Math.min(T, baseElapsed + (performance.now() - startedAt) / 1000);

    if (!fired.warn && W < P && elapsed >= P - W) { fired.warn = true; tones(SOUND_WARN); }
    if (!fired.pres && Q > 0 && elapsed >= P)     { fired.pres = true; tones(SOUND_PRES); }
    if (!fired.done && elapsed >= T) {
      fired.done = true; tones(SOUND_DONE);
      stopClock();
    }
    render();
  }
  function stopClock() {
    running = false;
    clearInterval(timer); timer = null;
    releaseWake();
    setLocked(elapsed > 0);
  }
  function setLocked(locked) { inPres.disabled = inQa.disabled = locked; }

  // ---- controls ----------------------------------------------------------
  function start() {
    if (running) return;
    ensureAudio();
    if (elapsed === 0) readSettings();
    if (elapsed >= T) return;
    running = true;
    baseElapsed = elapsed;
    startedAt = performance.now();
    setLocked(true);
    holdWake();
    timer = setInterval(tick, 100);
    tick();
  }
  function pause() {
    if (!running) return;
    tick();
    stopClock();
    render();
    $('phase').textContent = 'Paused';
  }
  function reset() {
    stopClock();
    elapsed = 0; baseElapsed = 0;
    fired = { warn: false, pres: false, done: false };
    setLocked(false);
    readSettings();
    render();
  }

  $('btnStart').addEventListener('click', start);
  $('btnPause').addEventListener('click', pause);
  $('btnReset').addEventListener('click', reset);
  [inPres, inQa].forEach(function (el) {
    el.addEventListener('input', function () { if (!running && elapsed === 0) { readSettings(false); render(); } });
    el.addEventListener('change', function () { if (!running && elapsed === 0) { readSettings(); render(); } });
  });
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' || e.repeat || e.target.tagName === 'INPUT') return;
    // a clicked button keeps focus; blur it so Space toggles instead of re-clicking it
    if (e.target.tagName === 'BUTTON') e.target.blur();
    e.preventDefault();
    running ? pause() : start();
  });

  // ---- keep the screen awake while the timer runs -----------------------
  var wakeLock = null;
  function holdWake() {
    if (!running || wakeLock || !navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  function releaseWake() { if (wakeLock) wakeLock.release(); }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') holdWake();
  });

  readSettings();
  render();
})();
</script>
</body>
</html>
